<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a14"/>
      <stop offset="100%" style="stop-color:#05050a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7B61FF;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#7B61FF;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#7B61FF;stop-opacity:0"/>
    </linearGradient>
  </defs>
  
  <rect width="400" height="200" fill="url(#bg)"/>
  
  <!-- Center mirror line -->
  <line x1="200" y1="30" x2="200" y2="170" stroke="#7B61FF" stroke-width="1" opacity="0.15" stroke-dasharray="4,4"/>
  
  <!-- Horizontal glow -->
  <line x1="0" y1="100" x2="400" y2="100" stroke="url(#glow)" stroke-width="1" opacity="0.2"/>
  
  <!-- c — open curve facing right -->
  <path d="M280,70 Q260,65 255,80 Q250,100 260,115 Q270,125 285,120" 
        fill="none" stroke="#e2e2ea" stroke-width="3" stroke-linecap="round"/>
  
  <!-- h — symmetric tower, reads same mirrored -->
  <path d="M300,65 L300,120 M300,75 Q315,70 320,85 Q322,100 315,110 Q308,118 300,115" 
        fill="none" stroke="#e2e2ea" stroke-width="3" stroke-linecap="round"/>
  
  <!-- o — perfect circle, self-symmetric -->
  <ellipse cx="340" cy="92" rx="14" ry="16" 
        fill="none" stroke="#e2e2ea" stroke-width="3"/>
  
  <!-- d — mirror of h with closed loop on right, self-symmetric -->
  <path d="M370,65 L370,120 M370,75 Q385,70 388,85 Q390,100 382,110 Q375,118 370,115" 
        fill="none" stroke="#e2e2ea" stroke-width="3" stroke-linecap="round"/>
  
  <!-- e — mirror of c, open curve facing left -->
  <path d="M415,92 L395,92 M405,82 Q395,92 405,102" 
        fill="none" stroke="#e2e2ea" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Bottom label -->
  <text x="200" y="185" text-anchor="middle" fill="#7B61FF" font-family="system-ui,sans-serif" font-size="11" letter-spacing="4">c h o d e</text>
  
  <!-- Top reversed label (mirror reading) -->
  <text x="200" y="25" text-anchor="middle" fill="#333" font-family="system-ui,sans-serif" font-size="9" letter-spacing="6">e d o h c</text>
  
  <!-- Corner dots -->
  <circle cx="30" cy="100" r="2" fill="#7B61FF" opacity="0.4"/>
  <circle cx="370" cy="100" r="2" fill="#7B61FF" opacity="0.4"/>
</svg>