name: Chode packaged Linux startup
on:
  push:
    branches: [master]
    paths: ['chode/**', '.github/workflows/chode-startup.yml']
  pull_request:
    paths: ['chode/**', '.github/workflows/chode-startup.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-startup:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 22]
    defaults:
      run:
        working-directory: chode
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ matrix.node }}'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node tests/entry-startup.test.js
      - name: Native skills and MCP transports
        run: |
          node tests/skill-catalog.test.js
          node tests/mcp-client.test.js
          node tests/mcp-oauth.test.js
          node tests/mcp-stdio.test.js
          node tests/integration-engine.test.js
          node tests/provider-directory.test.js
          node tests/provider-binding.test.js
          node tests/tui-command-matrix.test.js
      - name: Provider setup and progress watchdog regression
        run: |
          node tests/provider-connect.test.js
          node tests/provider-connect-runtime.test.js
          node tests/workspace-watchdog.test.js
          node tests/build-context.test.js
          node tests/tool-history.test.js
          node tests/build-job-verification.test.js
          node tests/stream-idle.test.js
          node tests/free-capacity.test.js
          node tests/local-models.test.js
          node tests/model-catalog.test.js
          node tests/provider-request.test.js
          node tests/public-pilot.test.js
          node tests/public-pilot-input.test.js
          node tests/python-hang-diagnostic.test.js
          node tests/edit-recovery.test.js
          node tests/observation-progress.test.js
          node tests/batch-recovery.test.js
          node tests/native-interruption-capacity.test.js
          node tests/platform-context.test.js
          node tests/exec-diagnostics.test.js
          node tests/capacity-continuation.test.js
          node tests/shared-tool-budget.test.js
          node tests/provider-race.test.js
          node tests/provider-recovery.test.js
          node tests/native-tools.test.js
          node tests/native-stream.test.js
          node tests/python-acceptance.test.js
          node tests/read-window.test.js
          node tests/read-window-agent.test.js
          node tests/free-repair-budget.test.js
          node tests/free-capacity-stop.test.js
          node tests/acceptance-feedback.test.js
      - name: Phase 1 editing and workflow regressions
        run: |
          node tests/edit-transactions.test.js
          node tests/worktrees.test.js
          node tests/execution-modes.test.js
          node tests/project-memory.test.js
          node tests/reliability-memory.test.js
          node tests/reliability-boundaries.test.js
          node tests/artifact-recovery.test.js
          node tests/orchestration-reserve.test.js
          node tests/certified-recap.test.js
          node tests/configurable-budget.test.js
          node tests/acceptance-summary.test.js
          node tests/python-edit-preservation.test.js
          node tests/production-public.test.js
          node tests/task-group.test.js
          node tests/verification-capture.test.js
      - name: Install packaged CLI and test native Linux startup
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          npm install --global --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/chode-install" "$RUNNER_TEMP/chode-$version.tgz"
          test "$("$RUNNER_TEMP/chode-install/bin/chode" --version)" = "$version"
          python3 tests/native-startup.py "$RUNNER_TEMP/chode-install/bin/chode"
          python3 tests/native-workflow.py "$RUNNER_TEMP/chode-install/bin/chode"
      - name: Verify public installer and installed Linux terminal
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          export CHODE_INSTALL_PREFIX="$RUNNER_TEMP/chode-live"
          curl -fsSL https://chode.borken.app/install.sh | sh
          expected=$(node -e "fetch('https://chode.borken.app/api/release',{cache:'no-store'}).then(r=>r.json()).then(r=>console.log(r.version)).catch(e=>{console.error(e);process.exit(1)})")
          test "$("$CHODE_INSTALL_PREFIX/bin/chode" --version)" = "$expected"
          python3 tests/native-startup.py "$CHODE_INSTALL_PREFIX/bin/chode"
          if test "$expected" = "$(node -p "require('./package.json').version")"; then python3 tests/native-workflow.py "$CHODE_INSTALL_PREFIX/bin/chode"; fi
